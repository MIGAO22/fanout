name: test

# 交叉编译不会执行任何一行代码，所以它抓不到「装上就跑不起来」的缺陷：
# 出口组的 port 从未回写、以及持 m.mu 写锁再要读锁造成的永久停摆，
# 都是在真机上第一次连接时才暴露的。这个 workflow 存在的唯一理由就是
# 让这类问题在合进去之前先在这里炸一次。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 类型检查
        run: go vet ./...

      - name: 编译
        run: go build ./...

      # 依赖 netns / root 的用例自己会 t.Skip（切不动命名空间就整条跳过），
      # 所以非 root 的 runner 上这套是跑得通的。
      #
      # set -o pipefail 不能省：GitHub 用的是 bash -e，它只看流水线里最后一条命令，
      # 而这里最后一条是 tee——永远成功。没有 pipefail 时 go test 报 FAIL 作业照样绿，
      # 连下面那个「失败时贴日志」的 if: failure() 都不会触发。
      # 这个门就这么连续放过过三次真失败的用例，而交叉编译抓不到任何运行期缺陷。
      - name: 测试
        run: |
          set -o pipefail
          go test -timeout 300s ./... 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Actions 的日志下载要鉴权，二开的时候助手读不到，红在哪一行只能瞎猜。
      # step summary 是公开字段，失败时把输出抄进去，一眼就能看到。
      - name: 把失败输出贴进 summary
        if: failure()
        run: |
          {
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/test.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 改成硬门槛了：原先「先只报不拦」，是因为竞态还没清。现在拦得住了——
      # 报出来的两处都在测试自己手里（直接写 tn.Status，绕开了 bringUpPersist
      # 那把锁），已经改成走 setter；生产代码里对 Tunnel 字段的读写都在锁上。
      - name: 数据竞争
        id: race
        run: |
          set -o pipefail
          go test -race -timeout 600s ./... 2>&1 | tee "$RUNNER_TEMP/race.log"

      - name: 把竞争报告贴进 summary
        if: always() && steps.race.outcome == 'failure'
        run: |
          {
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/race.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cross:
    # 发布走的是 amd64 / arm64 两个包，任一架构编不过就是发不出版。
    name: 交叉编译 ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - run: GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o /tmp/fanout ./cmd/fanout
